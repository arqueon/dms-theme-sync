name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install shell analysis tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Run ShellCheck
        run: shellcheck -S warning scripts/*.sh tests/*.sh

      - name: Test helper behavior
        run: tests/test-helper.sh

      - name: Test UI contracts
        run: tests/test-ui-contract.sh

      - name: Test read-only Flatpak diagnostics
        run: tests/test-flatpak-overrides.sh

      - name: Test Xresources backup retention
        run: tests/test-xresources-backups.sh
